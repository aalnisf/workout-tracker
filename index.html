<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>سجل التمرين</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }

  :root {
    --bg: #14171c;
    --bg-elevated: #1c2028;
    --border: #2a2f3a;
    --border-dashed: #3a3f4a;
    --text: #f0efe9;
    --text-strong: #f5f4f0;
    --muted: #9a9fac;
    --faint: #63687a;
    --accent: #ff6b35;
    --accent-soft-bg: rgba(255,107,53,0.15);
    --surface-2: #2a2f3a;
    --input-bg: #14171c;
    --btn-text-on-accent: #14171c;
  }
  :root[data-theme="light"] {
    --bg: #f7f6f3;
    --bg-elevated: #ffffff;
    --border: #e5e3dd;
    --border-dashed: #d8d5cc;
    --text: #14171c;
    --text-strong: #0d0f13;
    --muted: #6b6f7a;
    --faint: #8a8d99;
    --accent-soft-bg: rgba(255,107,53,0.12);
    --surface-2: #eeece6;
    --input-bg: #ffffff;
  }

  body {
    background-color: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    transition: background-color 0.2s, color 0.2s;
  }
  .mono { font-family: 'SF Mono', 'Courier New', monospace; }

  .container { max-width: 32rem; margin: 0 auto; padding: 1.5rem 1.25rem 5rem; position: relative; z-index: 1; min-height: 100vh; }

  .toolbar { max-width: 32rem; margin: 0 auto; padding: 0.75rem 1.25rem 0; display: flex; justify-content: flex-end; gap: 0.5rem; }

  .env-banner { background: var(--bg-elevated); border-bottom: 1px solid var(--border); padding: 0.5rem 1rem; text-align: center; font-size: 0.7rem; color: var(--faint); }

  .title { font-size: 1.25rem; font-weight: 800; color: var(--text-strong); letter-spacing: -0.01em; }
  .subtitle { color: var(--muted); font-size: 0.875rem; margin-bottom: 1.5rem; }
  .muted { color: var(--muted); }
  .faint { color: var(--faint); }
  .accent { color: var(--accent); }

  .card { background-color: var(--bg-elevated); border: 1px solid var(--border); border-radius: 1rem; padding: 1rem; }
  .card-btn {
    width: 100%; background-color: var(--bg-elevated); border: 1px solid var(--border); border-radius: 1rem; padding: 1rem;
    display: flex; align-items: center; justify-content: space-between; text-align: start;
    color: var(--text); transition: transform 0.1s, border-color 0.15s; cursor: pointer; font-family: inherit;
  }
  .card-btn:active { transform: scale(0.98); }

  .dashed-btn {
    width: 100%; background-color: var(--bg-elevated); border: 1px dashed var(--border-dashed); border-radius: 1rem; padding: 1rem;
    display: flex; align-items: center; justify-content: center; gap: 0.5rem;
    color: var(--muted); font-weight: 600; font-size: 0.875rem;
    transition: transform 0.1s, border-color 0.15s, color 0.15s; cursor: pointer; font-family: inherit;
  }
  .dashed-btn:active { transform: scale(0.98); }

  .primary-btn {
    width: 100%; background: linear-gradient(to left, #ff6b35, #ff8659); color: var(--btn-text-on-accent); border: none;
    border-radius: 1rem; padding: 1rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem;
    font-weight: 700; transition: transform 0.1s; cursor: pointer; font-family: inherit; font-size: 1rem;
  }
  .primary-btn:active { transform: scale(0.98); }

  .save-btn {
    width: 100%; background-color: var(--accent); color: var(--btn-text-on-accent); border: none; border-radius: 1rem; padding: 1rem;
    font-weight: 700; transition: transform 0.1s; cursor: pointer; font-family: inherit; font-size: 1rem;
  }
  .save-btn:active { transform: scale(0.98); }
  .save-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  .icon-btn {
    width: 2rem; height: 2rem; border-radius: 9999px; background-color: var(--surface-2); color: var(--text);
    display: flex; align-items: center; justify-content: center; transition: transform 0.1s;
    border: none; cursor: pointer; font-family: inherit; font-size: 1rem;
  }
  .icon-btn:active { transform: scale(0.9); }

  .icon-btn-sm {
    width: 2rem; height: 2rem; border-radius: 0.5rem; background-color: var(--surface-2); color: var(--muted);
    display: flex; align-items: center; justify-content: center; transition: transform 0.1s;
    flex-shrink: 0; border: none; cursor: pointer;
  }
  .icon-btn-sm:active { transform: scale(0.9); }

  .badge {
    width: 2.25rem; height: 2.25rem; border-radius: 0.75rem; display: flex; align-items: center; justify-content: center;
    font-size: 0.75rem; font-weight: 700; background-color: var(--surface-2); color: var(--muted);
  }
  .badge.done { background-color: var(--accent-soft-bg); color: var(--accent); }

  .tag {
    font-size: 9px; padding: 0.125rem 0.5rem; border-radius: 9999px;
    background-color: var(--accent-soft-bg); color: var(--accent); flex-shrink: 0;
  }

  .input {
    width: 100%; background-color: var(--input-bg); border: 1px solid var(--border); border-radius: 0.75rem;
    padding: 0.625rem 0.75rem; font-size: 0.875rem; color: var(--text-strong); caret-color: var(--accent); font-family: inherit;
  }
  .input:focus { outline: none; border-color: var(--accent); }
  .input::placeholder { color: var(--faint); opacity: 1; }
  .input-center { text-align: center; }

  .input-inline {
    width: 100%; background-color: var(--input-bg); border: 1px solid rgba(255,107,53,0.5); border-radius: 0.5rem;
    padding: 0.375rem 0.5rem; font-size: 0.875rem; color: var(--text-strong); caret-color: var(--accent); font-family: inherit;
  }
  .input-inline:focus { outline: none; }

  .checkbox { width: 1rem; height: 1rem; accent-color: var(--accent); }

  .status-pill { font-size: 10px; padding: 0.25rem 0.5rem; border-radius: 9999px; font-weight: 700; white-space: nowrap; }

  .bottom-bar {
    position: fixed; bottom: 0; left: 0; right: 0; max-width: 32rem; margin: 0 auto; padding: 1.25rem;
    background: linear-gradient(to top, var(--bg) 60%, transparent);
  }

  .back-btn {
    display: flex; align-items: center; gap: 0.25rem; color: var(--muted); font-size: 0.875rem; margin-bottom: 1rem;
    background: none; border: none; padding: 0; cursor: pointer; font-family: inherit;
  }

  .save-error-banner {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50; background: #ff6b35; color: #14171c;
    padding: 0.75rem 1rem; text-align: center; font-size: 0.875rem; font-weight: 700;
  }
  .save-error-banner button { margin-top: 0.375rem; text-decoration: underline; background: none; border: none; color: inherit; cursor: pointer; font-family: inherit; }

  input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }

  svg { display: block; }
</style>
</head>

        { id: "d6e7", name: "EZ Bar Preacher Curl", sets: 3, reps: 10, weight: 22.5, unit: "kg" },
        { id: "d6e8", name: "Oblique / Kneeling Cable Crunch", sets: 3, reps: 15, weight: 5, unit: "kg" }
      ]

  var DAY_ORDER = [1, 2, 3, 5, 6];
  var BAR_WEIGHT = 20;
  var STORAGE_KEY = "gym_workout_logs_v1";
  var THEME_KEY = "gym_theme_v1";
  var LANG_KEY = "gym_lang_v1";

  function barbellTotal(perSide) { return perSide * 2 + BAR_WEIGHT; }

  // ---------- I18N ----------
  var STRINGS = {
    ar: {
      appTitle: "سجل التمرين",
      envBanner: "نسخة محلية مستقلة — البيانات تُحفظ بمتصفحك على هذا الجهاز فقط",
      saveErrorBanner: "فشل الحفظ محلياً — تأكد أن مساحة تخزين المتصفح غير ممتلئة أو أن وضع التصفح الخاص غير مفعّل",
      close: "إغلاق",
      currentWeek: "الأسبوع الحالي",
      exercisesWord: "تمارين",

      newExercise: "تمرين جديد",
      tagExtra: "إضافي",
      tagSubstitute: "بديل",
      targetWord: "هدف",

      overloadTitle: "أرقام الأسبوع الجاي",
      overloadSubtitle: "مبني على آخر جلسة مسجلة لكل تمرين",
      statusIncreaseWeight: "زد الوزن",
      statusIncreaseReps: "زد تكرار",
      statusRepeat: "كرر نفس الأرقام",
      statusNoData: "لا يوجد سجل",
      themeToggleTitle: "تبديل الوضع الفاتح/الداكن",
      langToggleTitle: "English",
      exportData: "تصدير JSON",
      importData: "استيراد JSON",
      importConfirmMsg: "سيتم استبدال كل البيانات الحالية بالبيانات المستوردة. هل تريد المتابعة؟",
      importSuccessMsg: "تم استيراد البيانات بنجاح",
      importErrorMsg: "فشل استيراد الملف — تأكد أنه ملف JSON صحيح تم تصديره من هذا التطبيق"
    },
    en: {
      appTitle: "Workout Log",
      envBanner: "Local standalone version — your data is saved in this browser on this device only",
      saveErrorBanner: "Local save failed — make sure browser storage isn't full and private browsing isn't blocking it",
      close: "Close",
      currentWeek: "Current Week",
      exercisesWord: "exercises",
      freeDayBtn: "Free Day (Travel / Full Body / Upper-Lower)",
      overloadBtn: "Progressive Overload — Next Week's Numbers",
      back: "Back",
      weekWord: "Week",
      dayWord: "Day",
      exerciseNamePlaceholder: "Exercise name",
      newExercise: "New exercise",
      tagExtra: "Extra",
      tagSubstitute: "Swap",
      targetWord: "Target",
      editNameTitle: "Rename exercise",
      deleteFromSessionTitle: "Remove from this session",
      weightLabel: "Weight",
      perSideLabel: "(per side)",
      setsCountLabel: "Number of sets",
      repsPerSetLabel: "Reps per set",
      hitCeilingLabel: "Hit rep ceiling at RIR 2 (ready to increase weight)",
      addExerciseToSession: "Add exercise to this session",
      saveSession: "Save today's session",
      freeDayTitle: "Free Day",
      customSessionWord: "Custom session",
      dayNameLabel: "Day name",
      dayNamePlaceholder: "e.g. Travel Full Body",
      weightKgLabel: "Weight (kg)",
      addExercise: "Add exercise",
      saveFreeDay: "Save free day",
      overloadTitle: "Next Week's Numbers",
      overloadSubtitle: "Based on the last logged session for each exercise",
      statusIncreaseWeight: "Increase weight",
      statusIncreaseReps: "Increase reps",
      statusRepeat: "Repeat same numbers",
      statusNoData: "No data yet",
      themeToggleTitle: "Toggle light/dark mode",
      langToggleTitle: "عربي",
      exportData: "Export JSON",
      importData: "Import JSON",
      importConfirmMsg: "This will replace all current data with the imported data. Continue?",
      importSuccessMsg: "Data imported successfully",
      importErrorMsg: "Failed to import file — make sure it's a valid JSON file exported from this app"
    }
  };

  function t(key) {
    var s = STRINGS[state.lang][key];
    return s !== undefined ? s : STRINGS.ar[key];
  }

  function displayWeight(ex, weight) {
    if (ex.unit === "BW") return weight > 0 ? "BW +" + weight : "BW";
    if (ex.isBarbell) {
      return state.lang === "ar"
        ? weight + " كل جهة (" + barbellTotal(weight) + " إجمالي)"
        : weight + " per side (" + barbellTotal(weight) + " total)";
    }
    return state.lang === "ar" ? weight + " كيلو" : weight + " kg";
  }

  function fmtLastTime(week, weight, reps) {
    return state.lang === "ar"
      ? "آخر مرة (أسبوع " + week + "): " + weight + "kg × [" + reps.join("-") + "]"
      : "Last time (week " + week + "): " + weight + "kg × [" + reps.join("-") + "]";
  }
  function fmtLastTimeShort(weight, reps) {
    return state.lang === "ar"
      ? "آخر مرة: " + weight + "kg × [" + reps.join("-") + "]"
      : "Last time: " + weight + "kg × [" + reps.join("-") + "]";
  }

  // ---------- STORAGE ----------
  function loadLogs() {
    try {
      var raw = window.localStorage.getItem(STORAGE_KEY);
      if (!raw) return [];
      var parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) {
      console.error("failed to load logs", e);
      return [];
    }
  }
  function saveLogsToStorage(logs) {
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(logs));
      return true;
    } catch (e) {
      console.error("failed to save logs", e);
      return false;
    }
  }
  function loadTheme() {
    try { return window.localStorage.getItem(THEME_KEY) || "dark"; } catch (e) { return "dark"; }
  }
  function saveTheme(theme) {
    try { window.localStorage.setItem(THEME_KEY, theme); } catch (e) {}
  }
  function loadLang() {
    try { return window.localStorage.getItem(LANG_KEY) || "ar"; } catch (e) { return "ar"; }
  }
  function saveLang(lang) {
    try { window.localStorage.setItem(LANG_KEY, lang); } catch (e) {}
  }

  // ---------- EXPORT / IMPORT ----------
  function exportData() {
    var payload = { version: 1, exportedAt: new Date().toISOString(), logs: state.logs };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "workout-tracker-backup-" + new Date().toISOString().slice(0, 10) + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function isValidLogEntry(l) {
    return l && typeof l === "object" && typeof l.exerciseId === "string" &&
      typeof l.week === "number" && Array.isArray(l.actualReps);
  }

  function importDataFromFile(file) {
    var reader = new FileReader();
    reader.onload = function (e) {
      var logs;
      try {
        var parsed = JSON.parse(e.target.result);
        logs = Array.isArray(parsed) ? parsed : (parsed && Array.isArray(parsed.logs) ? parsed.logs : null);
        if (!logs || !logs.every(isValidLogEntry)) throw new Error("invalid format");
      } catch (err) {
        window.alert(t("importErrorMsg"));
        return;
      }
      if (!window.confirm(t("importConfirmMsg"))) return;
      var ok = saveLogsToStorage(logs);
      if (ok) {
        state.logs = logs;
        var maxWeek = logs.reduce(function (m, l) { return Math.max(m, l.week); }, 0);
        state.weekNum = maxWeek + 1 > 0 ? maxWeek + 1 : 1;
        state.saveError = false;
        render();
        window.alert(t("importSuccessMsg"));
      } else {
        state.saveError = true;
        render();
      }
    };
    reader.readAsText(file);
  }

  // ---------- PROGRESSIVE OVERLOAD ----------
  function computeSuggestion(exercise, lastEntry) {
    if (!lastEntry) {
      return { status: "no-data", weight: exercise.weight, reps: exercise.reps };
    }
    var actualReps = lastEntry.actualReps, weight = lastEntry.weight, hitCeiling = lastEntry.hitCeiling;
    var targetReps = exercise.reps;
    var allHit = actualReps.every(function (r) { return r >= targetReps; });

    if (hitCeiling && allHit) {
      return {
        status: "increase-weight",
        weight: Math.round((weight + 2.5) * 100) / 100,
        reps: targetReps
      };
    }
    if (allHit) {
      return { status: "increase-reps", weight: weight, reps: targetReps + 1 };
    }
    return { status: "repeat", weight: weight, reps: targetReps };
  }

  function suggestionNote(suggestion) {
    if (state.lang === "ar") {
      switch (suggestion.status) {
        case "no-data": return "لا يوجد سجل سابق — ابدأ بالأرقام الأساسية";
        case "increase-weight": return "وصلت السقف بـ RIR 2 — ارفع الوزن +2.5 كيلو وارجع لـ " + suggestion.reps + " تكرار";
        case "increase-reps": return "أنجزت كل الـ sets — زد تكرار واحد بنفس الوزن";
        case "repeat": return "لم تكمل الهدف بالكامل — كرر نفس الوزن والتكرار";
      }
    } else {
      switch (suggestion.status) {
        case "no-data": return "No previous record — start with the base numbers";
        case "increase-weight": return "You hit the ceiling at RIR 2 — increase weight +2.5kg and reset to " + suggestion.reps + " reps";
        case "increase-reps": return "You hit every set — add one more rep at the same weight";
        case "repeat": return "You didn't fully hit the target — repeat the same weight and reps";
      }
    }
  }

  // ---------- DOM HELPERS ----------
  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    attrs = attrs || {};
    for (var key in attrs) {
      if (key === "class") node.className = attrs[key];
      else if (key === "text") node.textContent = attrs[key];
      else if (key === "html") node.innerHTML = attrs[key];
      else if (key.indexOf("on") === 0 && typeof attrs[key] === "function") {
        node.addEventListener(key.slice(2).toLowerCase(), attrs[key]);
      } else if (key === "style" && typeof attrs[key] === "object") {

      } else {
        node.setAttribute(key, attrs[key]);
      }
    }
    children = children || [];
    children.forEach(function (child) {
      if (child === null || child === undefined) return;
      if (typeof child === "string") node.appendChild(document.createTextNode(child));
      else node.appendChild(child);
    });
    return node;

  }
  function lastEntryForName(name) {

      .sort(function (a, b) { return b.week - a.week; });

      state.view = "home";

      freeDayViewState = null;

  // ---------- LOG VIEW ----------
  function initLogViewState(day) {
    var program = PROGRAM[day];
    var sessionExercises = program.exercises.map(function (ex) {
      var copy = {};
      for (var k in ex) copy[k] = ex[k];
      copy.isExtra = false;
      copy.originalName = ex.name;
      return copy;
    });
    var entries = {};
    program.exercises.forEach(function (ex) {
      var last = lastEntryFor(ex.id);
      var sugg = computeSuggestion(ex, last);
      entries[ex.id] = { weight: sugg.weight, reps: new Array(ex.sets).fill(sugg.reps), hitCeiling: false };
    });
    return {
      day: day,
      program: program,
      sessionExercises: sessionExercises,
      entries: entries,
      expanded: program.exercises[0] ? program.exercises[0].id : null,
      editingNameId: null
    };
  }

      var last = ex.name.trim() ? lastEntryForName(ex.name) : null;
      var card = el("div", { class: "card" });

      var topRow = el("div", { style: { display: "flex", alignItems: "center", gap: "0.5rem", marginBottom: "0.75rem" } });
      var nameInput = el("input", { type: "text", value: ex.name, placeholder: t("exerciseNamePlaceholder"), class: "input", style: { flex: "1" } });
      nameInput.addEventListener("input", function (e) { ex.name = e.target.value; });
      topRow.appendChild(nameInput);
      var removeBtn = el("button", { class: "icon-btn-sm", style: { width: "2.25rem", height: "2.25rem", borderRadius: "0.75rem" } }, [Icons.trash({ size: 15 })]);
      removeBtn.addEventListener("click", function () {
        fvs.exercises = fvs.exercises.filter(function (e2) { return e2.localId !== ex.localId; });
        render();
      });
      topRow.appendChild(removeBtn);
      card.appendChild(topRow);

      if (last) {
        card.appendChild(el("div", {
          class: "mono faint", style: { fontSize: "0.75rem", marginBottom: "0.75rem" },
          text: fmtLastTime(last.week, last.weight, last.actualReps)
        }));
      }

      var midRow = el("div", { style: { display: "flex", gap: "0.75rem", marginBottom: "0.75rem" } });
      var weightCol = el("div", { style: { flex: "1" } }, [
        el("label", { class: "muted", style: { fontSize: "0.75rem", display: "block", marginBottom: "0.375rem" }, text: t("weightKgLabel") })
      ]);
      var weightInput = el("input", { type: "number", step: "0.5", value: ex.weight, class: "input mono" });
      weightInput.addEventListener("input", function (e) { ex.weight = e.target.value; });
      weightCol.appendChild(weightInput);
      midRow.appendChild(weightCol);

      var setsCol = el("div", { style: { width: "6rem" } }, [
        el("label", { class: "muted", style: { fontSize: "0.75rem", display: "block", marginBottom: "0.375rem" }, text: t("setsCountLabel") })
      ]);
      var setsInput = el("input", { type: "number", min: "1", max: "8", value: ex.sets, class: "input mono input-center" });
      setsInput.addEventListener("input", function (e) {
        var n = Math.max(1, Math.min(8, Number(e.target.value) || 1));
        ex.sets = n;
        var newReps = [];
        for (var i = 0; i < n; i++) newReps.push(ex.reps[i] !== undefined ? ex.reps[i] : "");
        ex.reps = newReps;
        render();
      });
      setsCol.appendChild(setsInput);
      midRow.appendChild(setsCol);
      card.appendChild(midRow);

      card.appendChild(el("label", { class: "muted", style: { fontSize: "0.75rem", display: "block", marginBottom: "0.375rem" }, text: t("repsPerSetLabel") }));
      var repsGrid = el("div", { style: { display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: "0.5rem" } });
      ex.reps.forEach(function (r, i) {
        var repInput = el("input", { type: "number", value: r, placeholder: "S" + (i + 1), class: "input mono input-center", style: { padding: "0.625rem 0.5rem" } });
        repInput.addEventListener("input", function (e) { ex.reps[i] = e.target.value; });
        repsGrid.appendChild(repInput);
      });
      card.appendChild(repsGrid);

      list.appendChild(card);
    });
    container.appendChild(list);

    var addBtn = el("button", { class: "dashed-btn" }, [Icons.plus({ size: 16, strokeWidth: 2.5 }), document.createTextNode(t("addExercise"))]);
    addBtn.addEventListener("click", function () {
      fvs.exercises.push({ localId: "custom_" + Date.now() + "_" + fvs.exercises.length, name: "", weight: "", sets: 3, reps: new Array(3).fill("") });
      render();
    });
    container.appendChild(addBtn);

    var canSave = fvs.dayLabel.trim().length > 0 && fvs.exercises.length > 0 && fvs.exercises.every(function (e) { return e.name.trim().length > 0; });
    var bottomBar = el("div", { class: "bottom-bar" });
    var saveBtn = el("button", { class: "save-btn", text: t("saveFreeDay") });
    saveBtn.disabled = !canSave;
    saveBtn.addEventListener("click", function () {
      var newEntries = fvs.exercises.map(function (e) {
        return {
          exerciseId: "custom_" + e.name.trim().toLowerCase().replace(/\s+/g, "_"),
          exerciseName: e.name.trim(),
          day: fvs.dayLabel.trim(),
          week: state.weekNum,
          weight: Number(e.weight) || 0,
          actualReps: e.reps.map(function (r) { return Number(r) || 0; }),
          hitCeiling: false,
          isCustom: true,
          timestamp: new Date().toISOString()
        };
      });
      persist(newEntries);
    });
    bottomBar.appendChild(saveBtn);
    container.appendChild(bottomBar);

    return container;
  }

  // ---------- OVERLOAD VIEW ----------
  function renderOverload() {
    var isRTL = state.lang === "ar";
    var container = el("div", { class: "container" });

    var backBtn = el("button", { class: "back-btn" }, [Icons.chevronRight({ size: 16, style: { transform: isRTL ? "none" : "rotate(180deg)" } }), document.createTextNode(t("back"))]);
    backBtn.addEventListener("click", function () { setView("home"); });
    container.appendChild(backBtn);

    container.appendChild(el("div", { style: { display: "flex", alignItems: "center", gap: "0.5rem", marginBottom: "0.25rem" } }, [
      Icons.trendingUp({ size: 20, className: "accent" }),
      el("h2", { style: { fontSize: "1.25rem", fontWeight: "800" }, text: t("overloadTitle") })
    ]));
    container.appendChild(el("p", { class: "muted", style: { fontSize: "0.875rem", marginBottom: "1.5rem" }, text: t("overloadSubtitle") }));

    var statusColors = {
      "increase-weight": { bg: "rgba(255,107,53,0.15)", text: "#ff6b35", label: t("statusIncreaseWeight") },
      "increase-reps": { bg: "rgba(74,222,128,0.15)", text: "#4ade80", label: t("statusIncreaseReps") },
      "repeat": { bg: "rgba(154,159,172,0.15)", text: "#9a9fac", label: t("statusRepeat") },
      "no-data": { bg: "rgba(99,104,122,0.15)", text: "#63687a", label: t("statusNoData") }
    };

    var groupsWrap = el("div", { style: { display: "flex", flexDirection: "column", gap: "1.5rem" } });

    DAY_ORDER.forEach(function (d) {
      var dayGroup = el("div");
      dayGroup.appendChild(el("div", { class: "mono muted", style: { fontSize: "0.75rem", marginBottom: "0.5rem", letterSpacing: "0.05em" }, text: "DAY " + d + " · " + PROGRAM[d].name.toUpperCase() }));

      var rowsWrap = el("div", { style: { display: "flex", flexDirection: "column", gap: "0.5rem" } });
      PROGRAM[d].exercises.forEach(function (ex) {
        var entries = state.logs.filter(function (l) { return l.exerciseId === ex.id; }).sort(function (a, b) { return b.week - a.week; });
        var last = entries[0] || null;
        var suggestion = computeSuggestion(ex, last);
        var s = statusColors[suggestion.status];

        var card = el("div", { class: "card" });
        var topRow = el("div", { style: { display: "flex", alignItems: "flex-start", justifyContent: "space-between", marginBottom: "0.5rem" } }, [
          el("span", { style: { fontWeight: "600", fontSize: "0.875rem" }, text: ex.name }),
          el("span", { class: "status-pill mono", style: { backgroundColor: s.bg, color: s.text }, text: s.label })
        ]);
        card.appendChild(topRow);

        if (last) {
          card.appendChild(el("div", {
            class: "mono faint", style: { fontSize: "0.75rem", marginBottom: "0.25rem" },
            text: fmtLastTimeShort(last.weight, last.actualReps)
          }));
        }

        var unitSuffix = ex.unit === "BW" ? "" : "kg";
        card.appendChild(el("div", { class: "mono", style: { fontSize: "0.875rem", fontWeight: "700", color: "var(--text-strong)" }, text: "→ " + suggestion.weight + unitSuffix + " × " + suggestion.reps + " reps" }));
        card.appendChild(el("div", { class: "muted", style: { fontSize: "0.75rem", marginTop: "0.25rem" }, text: suggestionNote(suggestion) }));

        rowsWrap.appendChild(card);
      });

      dayGroup.appendChild(rowsWrap);
      groupsWrap.appendChild(dayGroup);
    });

    container.appendChild(groupsWrap);
    return container;
  }

  // ---------- INIT ----------
  applyTheme();
  applyLang();
  render();
})();
</script>
</body>
</html>
